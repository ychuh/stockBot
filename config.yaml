# =====================================================
# Stock Radar - 策略設定檔
# 修改這個檔案就能調整策略，不需要動 Python 程式碼
# =====================================================

strategies:
  # 動能 + 籌碼策略：近期創新高 + 均線向上 + 外資連續買超
  momentum_chip:
    enabled: true

    # --- 動能條件 ---
    new_high_window: 20         # 過去 N 個交易日內曾創新高
    lookback_high: 252          # 新高的定義（252 = 約 52 週）
    slope_lookback: 5           # 斜率比較的回看天數

    # --- 籌碼條件 ---
    foreign_consecutive_days: 5 # 外資連續買超天數
    foreign_min_net_buy: 1000   # 外資 N 日累計買超下限（張）

    # --- 流動性過濾 ---
    min_avg_volume: 1000000     # 20 日日均量下限（股）

    # --- 顯示設定 ---
    top_n: 30

  # MA20 斜率向上 + 外資投信同步買超
  slope_sync_chip:
    enabled: true

    slope_lookback: 5           # MA20 斜率比較的回看天數
    top_n: 30                   # 最多顯示幾檔

  # 關鍵券商當日買超前五標的（讀取 key_pivot_levels.csv）
  key_broker_analysis:
    enabled: true

    top_n: 5                    # 每個券商顯示幾檔


# 資料設定
data:
  history_days: 400
  chip_days: 30

